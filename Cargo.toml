[package]
name = "shell"            # Cargo 包名必须 ASCII；可执行文件见下面的 [[bin]]
version = "0.1.0"
edition = "2021"
description = "壳语言：中文命名的 shell，编译产物名为「壳」"
license = "AGPL-3.0-or-later"   # AGPL 第 3 版或任何更高版本

[[bin]]
name = "壳"
path = "源码/主体.rs"

# 依赖均为 MIT / Apache-2.0 许可，与 AGPL-3.0-or-later 兼容。
[dependencies]
clap = { version = "4", features = ["derive"] }   # 命令行参数解析
dirs = "7"                                        # 跨平台家目录
glob = "0.3"                                      # shell 风格通配匹配（替代手写）
libc = "0.2"                                      # C 库绑定（替代手写 extern）
rustyline = "17"                                  # 交互行编辑（历史 / 方向键）
serde = { version = "1", features = ["derive"] }  # 值类型序列化
serde_json = "1"                                  # JSON 导入导出
thiserror = "2"                                   # 错误类型派生

# 最激进优化：全力换运行速度/体积，牺牲编译时间。
[profile.release]
opt-level = 3
lto = "fat"          # 全程序链接时优化
codegen-units = 1    # 单代码生成单元，最大化跨模块优化
panic = "abort"      # 不保留回溯表
overflow-checks = false
debug = false
strip = true
