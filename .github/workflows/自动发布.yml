# 发布工作流：发布 Release 时自动编译 Linux 版本并上传；也可以在 Actions 页面手动触发。
#
# 触发方式：
#   1. 在 GitHub 网页或 gh 里发布（Publish）一个 Release —— 自动编译并附加到该 Release；
#   2. Actions →「自动发布 Linux 版本」→ Run workflow（选择是否创建 Release）。
#
# 版本号一律从 Cargo.toml 读取，发布标签为 v<版本号>；不需要也不能手工填写。
#
# 产物：单个可执行文件 shell-<版本>-linux-x86_64 与同名 .sha256（不打包）。只发布 x86_64。
#
# 说明：Runner 上的 bash 在赋值语句里只认 ASCII 变量名，所以脚本里的 shell 变量统一用英文，
# 只有工作流名、job 名、步骤名、输入名称这些「给人看的」文字用中文。

name: 自动发布

on:
  release:
    types: [published]
  workflow_dispatch:
    # 版本号一律读取 Cargo.toml，不再手工填写
    inputs:
      create_release:
        description: "手动触发时，是否创建（或更新）对应的 Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先把版本号和标签算出来，供后面的构建与发布任务共用
  prepare:
    name: 计算版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取 Cargo.toml 的版本号
        id: read
        shell: bash
        run: |
          set -euo pipefail
          # Cargo.toml 里的 version = "x.y.z"（只取 [package] 段的第一个 version）
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::没有从 Cargo.toml 读到版本号"
            exit 1
          fi
          # 标签统一由版本号生成：v<Cargo.toml 中的版本号>
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml 版本：$version，发布标签：$tag"
          if [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"
            if [ "$release_tag" != "$tag" ]; then
              echo "::warning::这个 Release 的标签是 $release_tag，而 Cargo.toml 的版本对应 $tag；以 Cargo.toml 为准。"
            fi
          fi

  build:
    name: 编译 Linux x86_64 可执行文件
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      binary: ${{ steps.pack.outputs.binary }}
      checksum: ${{ steps.pack.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译
        run: |
          cargo build --release --locked
          # 产物目录由 .cargo/config.toml 指定为「构建」
          test -x "构建/release/壳" && ls -l "构建/release/壳"

      - name: 准备发布文件（单个可执行文件，不压缩）
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          # 上传文件名只用 ASCII，下载者用 curl/wget 时不必处理中文名；程序本身仍叫「壳」
          name="shell-${version}-linux-x86_64"
          mkdir -p dist
          install -m 755 "构建/release/壳" "dist/$name"
          sha256sum "dist/$name" > "dist/$name.sha256"
          echo "binary=$name" >> "$GITHUB_OUTPUT"
          echo "checksum=$name.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist/

      - name: 自检
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ steps.pack.outputs.binary }}" -c 'echo 自检通过 | tr a-z A-Z'
          "./dist/${{ steps.pack.outputs.binary }}" -h | head -n1

      - name: 上传到本次 Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # 直接用当前 Release 的标签，保证文件挂到触发它的那个 Release 上
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/${{ steps.pack.outputs.binary }}
            dist/${{ steps.pack.outputs.checksum }}
          fail_on_unmatched_files: true

      - name: 保存为工作流产物
        uses: actions/upload-artifact@v4
        with:
          name: 壳-linux-x86_64
          path: dist/
          if-no-files-found: error

  # 手动触发时：把可执行文件挂到 Release 上（标签还没有 Release 就创建；已有则追加/覆盖同名文件）
  publish:
    name: 发布到 GitHub Release
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建好的文件
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 壳 ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/shell-*

            dist/*.sha256
